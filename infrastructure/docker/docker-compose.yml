services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    image: phoenix-db:latest
    container_name: phoenix-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-phoenix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phoenix}
      POSTGRES_DB: ${POSTGRES_DB:-phoenix_db}
    ports:
      - "25432:5432"
    volumes:
      - phoenix_db_data:/home/postgres/pgdata/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-phoenix} -d ${POSTGRES_DB:-phoenix_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: phoenix-redis
    ports:
      - "26379:6379"
    volumes:
      - phoenix_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ../../
      dockerfile: apps/api/Dockerfile
    container_name: phoenix-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-phoenix}:${POSTGRES_PASSWORD:-phoenix}@db:5432/${POSTGRES_DB:-phoenix_db}
      REDIS_URL: redis://redis:6379
      API_HOST: 0.0.0.0
      API_PORT: 28000
      API_DEBUG: ${API_DEBUG:-true}
    ports:
      - "28000:8000"
    volumes:
      - ../../apps/api:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../../
      dockerfile: apps/web/Dockerfile
    container_name: phoenix-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:28000
    ports:
      - "23000:23000"
    volumes:
      - ../../apps/web/src:/app/apps/web/src
      - ../../apps/web/public:/app/apps/web/public
    depends_on:
      - api
    restart: unless-stopped

volumes:
  phoenix_db_data:
  phoenix_redis_data:
