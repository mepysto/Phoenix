services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    image: phoenix-db:latest
    container_name: phoenix-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-phoenix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phoenix}
      POSTGRES_DB: ${POSTGRES_DB:-phoenix_db}
    ports:
      # Loopback only: reachable by host-run dev servers, not the network
      - "127.0.0.1:25432:5432"
    volumes:
      - phoenix_db_data:/home/postgres/pgdata/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-phoenix} -d ${POSTGRES_DB:-phoenix_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: phoenix-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-phoenix-dev-redis}"]
    ports:
      - "127.0.0.1:26379:6379"
    volumes:
      - phoenix_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:-phoenix-dev-redis}\" --no-auth-warning ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ../../
      dockerfile: apps/api/Dockerfile
    container_name: phoenix-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-phoenix}:${POSTGRES_PASSWORD:-phoenix}@db:5432/${POSTGRES_DB:-phoenix_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-phoenix-dev-redis}@redis:6379
      API_DEBUG: ${API_DEBUG:-false}
      API_SYNC_KEY: ${API_SYNC_KEY:-dev-sync-key}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "28000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../../
      dockerfile: apps/web/Dockerfile
      target: runner
      args:
        # Inlined into the browser bundle at build time: the URL browsers use
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:28000}
    container_name: phoenix-web
    ports:
      - "23000:23000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  phoenix_db_data:
  phoenix_redis_data:
